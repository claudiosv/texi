site_name: texi
site_description: An isolated workspace manager for LaTeX projects.
site_url: https://claudiosv.github.io/texi/
repo_url: https://github.com/claudiosv/texi
repo_name: claudiosv/texi
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    # - navigation.sections
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Commands:
      - Overview: commands/index.md
      - Project setup: commands/project.md
      - Build, preview, clean: commands/build.md
      - fix-pdf: commands/fix-pdf.md
      - Format, export, build-tree: commands/tools.md
      - TeX Live maintenance: commands/maintenance.md
      - Cache: commands/cache.md
  - Configuration: configuration.md
  - API Reference:
      - Overview: api/index.md
      - pdffonts: api/pdffonts.md
      - latexmk_files: api/latexmk_files.md
      - ctan: api/ctan.md
      - logparse: api/logparse.md
      - config: api/config.md
      - tlpdb: api/tlpdb.md
      - resolver: api/resolver.md
      - archive: api/archive.md
      - tlactions: api/tlactions.md
  - Roadmap: roadmap.md

plugins:
  - search
  - tags
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true
      cache_safe: true
  - glightbox
  - optimize:
      optimize_png: false  # needs system pngquant, absent locally and in CI
  - offline:
      enabled: !ENV [OFFLINE, false]  # incompatible with navigation.instant; build with OFFLINE=true
  - llmstxt:
      markdown_description: An isolated workspace manager for LaTeX projects.
      full_output: llms-full.txt
      sections:
        Home:
          - index.md
        Commands:
          - commands/*.md
        Configuration:
          - configuration.md
        API Reference:
          - api/*.md
        Roadmap:
          - roadmap.md
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.striphtml
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 3

watch:
  - src/texi
  - README.md
