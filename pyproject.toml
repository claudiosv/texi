[project]
name = "texi-cli"
version = "0.1.0"
description = "An isolated workspace manager for LaTeX projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Claudio Spiess", email = "claudiovspiess@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.29.0",
    "rich>=15.0.0",
    "pydantic>=2.14.3",
    "inflect>=7.5.0",
    "sh>=2.4.0",
    "pyclack-cli",
    "pymupdf>=2.1",
    "fonttools>=4.68.0",
    "hishel[httpx2]>=2.0.0",
    "httpx2>=2.16.0",
    "tree-sitter-language-pack>=1.25.0",
]
keywords = ["latex", "texlive", "tlmgr", "latexmk", "workspace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Editors :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/claudiosv/texi"
Repository = "https://github.com/claudiosv/texi"
"Bug Tracker" = "https://github.com/claudiosv/texi/issues"

[project.scripts]
texi = "texi.cli:app"

[tool.uv.build-backend]
module-name = "texi"

[tool.uv.sources]
pyclack-cli = { path = "/Users/claudio/Projects/pyclack-rich" }

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.26,<0.12"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.5",
    "mkdocs-glightbox>=0.5.3",
    "mkdocs-llmstxt>=0.5.1",
    "mkdocs-material[imaging]>=9.8.1",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings-python>=2.0.10",
    "mkdocstrings[python]>=1.0.8",
]

[tool.pytest.ini_options]
markers = ["network: hits the live CTAN API; skipped unless --network or TEXI_NETWORK=1"]
timeout = 60

[tool.coverage.run]
source = ["texi"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
