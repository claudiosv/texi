[project]
name = "texi-cli"
version = "0.1.0"
description = "An isolated workspace manager for LaTeX projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Claudio Spiess", email = "claudiovspiess@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.26",
    "rich>=15",
    "pydantic>=2.13.4",
    "httpx>=0.28.1,<1.0.0",
    "inflect>=7.5.0",
]
keywords = ["latex", "texlive", "tlmgr", "latexmk", "workspace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/claudiosv/texi"
Repository = "https://github.com/claudiosv/texi"
"Bug Tracker" = "https://github.com/claudiosv/texi/issues"

[project.scripts]
texi = "texi.cli:app"

[tool.uv.build-backend]
module-name = "texi"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.26,<0.12"]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "ty>=0.0.55",
]
