[project]
name = "texi"
version = "0.1.0"
description = "An isolated workspace manager for LaTeX projects."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.26",
    "rich>=15",
    "pydantic>=2.13.4",
    "httpx>=0.28.1,<1.0.0",
    "inflect>=7.5.0",
]

[project.scripts]
texi = "texi.cli:app"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.26,<0.12"]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "ty>=0.0.55",
]
