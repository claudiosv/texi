name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Check that the tag matches the project version
        run: test "$GITHUB_REF" = "refs/tags/v$(uv version --short)"

      - name: Build
        run: uv build

      - name: Smoke test the wheel as installed from PyPI
        run: uv run --isolated --no-project --python 3.14 --with dist/*.whl texi --help

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/texi-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Publish
        run: uv publish --trusted-publishing always
